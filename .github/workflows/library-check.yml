name: Library discovery checks
on:
  push:
    branches: [main, stv-library-discovery-repair]
    paths: ['scripts/discover_library.py', 'tests/test_discover_library.py', '.github/workflows/library-check.yml']
  pull_request:
    paths: ['scripts/discover_library.py', 'tests/test_discover_library.py', '.github/workflows/library-check.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_discover_library.py' -v
