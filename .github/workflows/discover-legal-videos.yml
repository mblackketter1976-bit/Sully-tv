name: Discover legally reusable videos
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: write
concurrency:
  group: sully-legal-library
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover licensed Commons videos
        run: python scripts/discover_legal_videos.py
      - name: Commit updated catalog
        run: |
          git config user.name "sully-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legal-library.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatically discover openly licensed video catalog entries"
            git push
          fi
