name: Discover free licensed videos
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_library.py'
      - '.github/workflows/discover-library.yml'
permissions:
  contents: write
concurrency:
  group: sully-library-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find reusable video sources
        run: python scripts/discover_library.py
      - name: Commit verified additions
        run: |
          if ! git diff --quiet -- data/legal-library.json; then
            git config user.name "sully-library-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/legal-library.json
            git commit -m "Automatically add licensed video catalog entries"
            git push
          else
            echo "No new eligible videos found"
          fi
