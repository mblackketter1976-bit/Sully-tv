name: Update sourced TV Guide
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_tv_guide.py'
      - '.github/workflows/update-tv-guide.yml'
      - 'scripts/sully_epg_engine.py'
      - 'scripts/tvmaze_guide.py'
      - 'data/guide-sources.json'
permissions:
  contents: read
concurrency:
  group: sully-epg-update
  cancel-in-progress: false
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test normalization and refresh before fetching
        run: python -m unittest discover -s tests -v
      - name: Refresh reviewed XMLTV providers
        run: python scripts/update_tv_guide.py
      - name: Retain guide candidate for review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: sully-guide-candidate
          path: data/tv-guide.json
          retention-days: 7
