name: Update sourced TV Guide
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_tv_guide.py'
      - '.github/workflows/update-tv-guide.yml'
permissions:
  contents: read
concurrency:
  group: sully-epg-update
  cancel-in-progress: false
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate public XMLTV guide sources
        run: python scripts/update_tv_guide.py
      - name: Validate generated guide output (test only)
        run: |
          python -c 'import json,pathlib; p=pathlib.Path("data/tv-guide.json"); d=json.loads(p.read_text()); print("Guide channels:",len(d.get("channels",{}))); assert d.get("channels"), "No channels in generated guide"'
