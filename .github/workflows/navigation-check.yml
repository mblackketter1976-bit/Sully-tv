name: Navigation layout checks
on:
  push:
    branches: [sully-navigation-hotfix, stv-sports-local-release, main]
    paths: ['index.html', 'tests/navigation-browser.cjs', '.github/workflows/navigation-check.yml']
  pull_request:
    paths: ['index.html', 'tests/navigation-browser.cjs', '.github/workflows/navigation-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/navigation-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-screenshots
          path: navigation-*.png
          retention-days: 7
