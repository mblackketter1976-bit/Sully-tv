name: Sully Guide Engine offline tests
on:
  push:
    branches: [sully-phase1-foundation-audit]
    paths:
      - 'scripts/sully_epg_engine.py'
      - 'tests/test_sully_epg_engine.py'
      - '.github/workflows/sully-epg-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m py_compile scripts/sully_epg_engine.py tests/test_sully_epg_engine.py
      - name: Run synthetic XMLTV unit tests
        run: python -m unittest discover -s tests -p 'test_sully_epg_engine.py' -v
