
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sully TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#1b2941;padding:18px;text-align:center}
h1{font-size:34px;margin:0;color:#69caff}
header p{color:#bbcbe0;margin:8px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#152138}
button,select,input{background:#304362;color:white;border:1px solid #52688b;border-radius:10px;padding:12px;font-size:15px}
button{cursor:pointer;touch-action:manipulation}
button.active{background:#1976d2}
main{max-width:1200px;margin:auto;padding:12px}
video{display:block;width:100%;aspect-ratio:16/9;background:black;border-radius:12px}
#now{padding:12px;color:#bde3ff}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin:12px 0}
.filters input,.filters select{width:100%}
#status{padding:10px;color:#a6d7ff}
#guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:#233551;border:1px solid #45648c;border-radius:15px;padding:13px;cursor:pointer;min-height:145px;display:flex;flex-direction:column;gap:9px;touch-action:manipulation}
.card:active{background:#36557f}
.card h3{font-size:17px;margin:0;overflow-wrap:anywhere}
.card small{color:#b7c9df}
.actions{display:flex;gap:6px;margin-top:auto}
.actions button{padding:9px 7px;font-size:13px;flex:1}
.watch{background:#166dc1}
#more{display:none;width:100%;margin-top:18px}
footer{text-align:center;color:#9eafc8;padding:25px;font-size:12px}
@media(max-width:500px){
#guide{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{padding:10px}
.card h3{font-size:15px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
<header>
<h1>📺 SULLY TV</h1>
<p>Your world. Your channels. Your entertainment.</p>
</header>

<nav id="nav"></nav>

<main>
<video id="player" controls playsinline></video>
<div id="now">Select a channel from the guide below.</div>
<button id="fullscreen">⛶ Fullscreen</button>

<div class="filters">
<input id="search" type="search" placeholder="🔎 Search channels">
<select id="country"><option value="">🌎 All Countries</option></select>
<select id="region"><option value="">All States / Regions</option></select>
<select id="topic"><option value="">All Subcategories</option></select>
</div>

<div id="status">Loading free television channels...</div>
<div id="guide"></div>
<button id="more">Show More Channels</button>
</main>

<footer>
Sully TV • Free public channel directory<br>
Some broadcasts may be offline or restricted by region.
</footer>

<script>
"use strict";

const $=id=>document.getElementById(id);

const categories={
"🌎 All TV":[],
"📍 Local TV":[],
"🏆 Sports":["Football","Soccer","Basketball","Baseball","Hockey","Tennis","Golf","Motorsports","Boxing","Cricket"],
"🧠 Documentaries":["Science","History","Nature","Space","Technology","Travel","Education"],
"⭐ Reality":["Entertainment","Lifestyle","Cooking","Music","Shopping"],
"👻 Carrie's Horror Channel":["Horror","Paranormal","Mystery","Thriller"],
"❤️ Favorites":[]
};

let section="🌎 All TV";
let channels=[];
let streams=new Map();
let countries=new Map();
let page=0;
let hls=null;
let favorites=new Set();

try{
favorites=new Set(JSON.parse(localStorage.getItem("sully-tv-favs")||"[]"));
}catch(e){}

const sports=/sport|football|soccer|basketball|baseball|hockey|tennis|golf|motorsport|boxing|mma|cricket/i;
const docs=/documentary|science|history|nature|space|technology|education|travel|knowledge|discovery/i;
const reality=/reality|entertainment|lifestyle|cooking|music|shopping|competition|talent/i;
const horror=/horror|paranormal|ghost|haunt|thriller|mystery|terror|monster/i;

function renderNav(){
const nav=$("nav");
nav.replaceChildren();
for(const name of Object.keys(categories)){
const b=document.createElement("button");
b.textContent=name;
b.className=name===section?"active":"";
b.onclick=()=>{
section=name;
page=0;
$("search").value="";
$("topic").value="";
renderNav();
renderTopics();
renderGuide();
};
nav.append(b);
}
}

function renderTopics(){
const select=$("topic");
select.replaceChildren(new Option("All Subcategories",""));
for(const topic of categories[section]){
select.add(new Option(topic,topic));
}
}

function renderRegions(){
const select=$("region");
const old=select.value;
select.replaceChildren(new Option("All States / Regions",""));
const code=$("country").value;
const regions=[...new Set(
channels.filter(c=>!code||c.country===code)
.map(c=>c.subdivision).filter(Boolean)
)].sort();
for(const r of regions)select.add(new Option(r,r));
if(regions.includes(old))select.value=old;
}

function matches(c){
const info=[
c.name,
c.id,
c.country,
c.countryName,
c.subdivision,
c.city,
...(c.categories||[])
].filter(Boolean).join(" ").toLowerCase();

if(section==="❤️ Favorites"&&!favorites.has(c.id))return false;
if(section==="🏆 Sports"&&!sports.test(info))return false;
if(section==="🧠 Documentaries"&&!docs.test(info))return false;
if(section==="⭐ Reality"&&!reality.test(info))return false;
if(section==="👻 Carrie's Horror Channel"&&!horror.test(info))return false;
if(section==="📍 Local TV"&&!(/news|local|regional|general/i.test(info)||c.subdivision))return false;

if($("country").value&&c.country!==$("country").value)return false;
if($("region").value&&c.subdivision!==$("region").value)return false;
if($("topic").value&&!info.includes($("topic").value.toLowerCase()))return false;
if($("search").value&&!info.includes($("search").value.toLowerCase().trim()))return false;
return true;
}

function playChannel(c){
const source=streams.get(c.id);
if(!source)return;

const video=$("player");

if(hls){
hls.destroy();
hls=null;
}

video.pause();
video.removeAttribute("src");
video.load();

$("now").textContent="Now playing: "+c.name;

const url=source.url;

if(/\.m3u8(?:\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{
video.play().catch(()=>{});
});
hls.on(Hls.Events.ERROR,(_,data)=>{
if(data.fatal)$("now").textContent=c.name+" — Stream unavailable. Try another channel.";
});
}else{
video.src=url;
video.play().catch(()=>{});
}

video.onerror=()=>{
$("now").textContent=c.name+" — This stream cannot play here.";
};

video.scrollIntoView({behavior:"smooth",block:"start"});
}

function toggleFavorite(c){
if(favorites.has(c.id))favorites.delete(c.id);
else favorites.add(c.id);
try{
localStorage.setItem("sully-tv-favs",JSON.stringify([...favorites]));
}catch(e){}
renderGuide();
}

function makeCard(c){
const card=document.createElement("article");
card.className="card";
card.tabIndex=0;
card.setAttribute("role","button");
card.setAttribute("aria-label","Watch "+c.name);

const title=document.createElement("h3");
title.textContent=c.name;

const meta=document.createElement("small");
meta.textContent=[c.countryName||c.country,c.subdivision,c.city].filter(Boolean).join(" • ");

const actions=document.createElement("div");
actions.className="actions";

const watch=document.createElement("button");
watch.className="watch";
watch.textContent="▶ Watch";
watch.onclick=e=>{
e.stopPropagation();
playChannel(c);
};

const fav=document.createElement("button");
fav.textContent=favorites.has(c.id)?"♥ Saved":"♡ Save";
fav.onclick=e=>{
e.stopPropagation();
toggleFavorite(c);
};

actions.append(watch,fav);
card.append(title,meta,actions);

card.onclick=e=>{
if(!e.target.closest("button"))playChannel(c);
};

card.onkeydown=e=>{
if((e.key==="Enter"||e.key===" ")&&e.target===card){
e.preventDefault();
playChannel(c);
}
};

return card;
}

function renderGuide(){
const found=channels.filter(matches);
const visible=found.slice(0,(page+1)*80);
const fragment=document.createDocumentFragment();

for(const c of visible)fragment.append(makeCard(c));

$("guide").replaceChildren(fragment);
$("status").textContent=found.length.toLocaleString()+" channels found — "+visible.length+" shown";
$("more").style.display=visible.length<found.length?"block":"none";
}

$("search").oninput=()=>{page=0;renderGuide()};
$("country").onchange=()=>{page=0;renderRegions();renderGuide()};
$("region").onchange=()=>{page=0;renderGuide()};
$("topic").onchange=()=>{page=0;renderGuide()};
$("more").onclick=()=>{page++;renderGuide()};

$("fullscreen").onclick=()=>{
const v=$("player");
if(v.requestFullscreen)v.requestFullscreen();
else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();
};

async function getJSON(file){
const response=await fetch("https://iptv-org.github.io/api/"+file);
if(!response.ok)throw Error(file+" unavailable");
return response.json();
}

async function initialize(){
renderNav();
renderTopics();

try{
const [allChannels,allStreams,allCountries]=await Promise.all([
getJSON("channels.json"),
getJSON("streams.json"),
getJSON("countries.json")
]);

countries=new Map(allCountries.map(c=>[c.code,c.name]));

for(const s of allStreams){
if(s.channel&&s.url&&/^https?:\/\//i.test(s.url)&&!streams.has(s.channel)){
streams.set(s.channel,s);
}
}

channels=allChannels
.filter(c=>!c.is_nsfw&&streams.has(c.id))
.map(c=>({...c,countryName:countries.get(c.country)||c.country}));

for(const c of [...allCountries].sort((a,b)=>a.name.localeCompare(b.name))){
$("country").add(new Option(c.name,c.code));
}

renderRegions();
renderGuide();

}catch(error){
$("status").textContent="Channel directory could not load. Check your internet connection and refresh. "+error.message;
}
}

initialize();
</script>
</body>
</html>
